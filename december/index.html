<style>
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:var(--text-base);line-height:1.6;-webkit-font-smoothing:antialiased}
html[lang^=zh] body{font-family:'Noto Sans HK',var(--f-body)}
img{max-width:100%;height:auto;display:block}
.wrap{width:min(1120px,100% - 2.5rem);margin:0 auto}
h1,h2,h3{font-family:var(--f-display);font-weight:600;letter-spacing:-.01em;line-height:1.1;margin:0}
html[lang^=zh] h1,html[lang^=zh] h2,html[lang^=zh] h3{font-family:'Noto Serif HK',var(--f-display)}
p{margin:0}
.kicker{font-size:var(--text-xs);font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--lilac-ink);display:flex;align-items:center;gap:.6rem;margin-bottom:var(--s4)}
.kicker:before{content:"";width:28px;height:2px;background:currentColor}
.muted{color:var(--ink-2)}
.bar{position:sticky;top:0;z-index:5;background:rgba(246,240,230,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar-in{display:flex;align-items:center;justify-content:space-between;height:68px}
.brand{display:flex;align-items:center;gap:.65rem;text-decoration:none;color:inherit}
.brand img{width:40px;height:40px}.brand b{display:block;font-size:var(--text-sm);line-height:1.2}.brand small{color:var(--ink-2);font-size:var(--text-xs)}
.lang{display:flex;border:1px solid var(--line-2);border-radius:999px;padding:3px;background:var(--card)}
.lang button{font:inherit;font-size:var(--text-sm);font-weight:700;border:0;background:none;color:var(--ink-2);padding:.35rem .9rem;border-radius:999px;cursor:pointer;min-height:36px}
.lang button[aria-pressed=true]{background:var(--ink);color:#fff}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.55rem;min-height:50px;padding:0 1.5rem;border-radius:999px;font-weight:700;text-decoration:none;font-size:var(--text-base);transition:transform .25s var(--ease),box-shadow .25s var(--ease)}
.btn:hover{transform:translateY(-1px);box-shadow:0 12px 24px -16px rgba(43,36,51,.6)}
.btn-wa{background:var(--slate-ink);color:#fff}
.btn-ghost{border:1.5px solid var(--line-2);color:var(--ink);background:transparent}
.hero{padding:clamp(2.5rem,6vw,5rem) 0 clamp(2.5rem,5vw,4rem)}
.hero-grid{display:grid;gap:clamp(2rem,4vw,3.5rem);align-items:center}
@media (min-width:900px){.hero-grid{grid-template-columns:1fr 1.05fr}}
.hero h1{font-size:clamp(2.6rem,1.4rem + 4.6vw,4.6rem)}
.hero .zh{font-family:'Noto Serif HK',serif;font-weight:700;font-size:var(--text-xl);color:var(--ink-2);margin-top:.5rem}
html[lang^=zh] .hero .zh{display:none}
.hero .lead{font-size:var(--text-lg);color:var(--ink-2);margin-top:var(--s5);max-width:34ch;line-height:1.45}
.cta{display:flex;flex-wrap:wrap;gap:.75rem;margin-top:var(--s8)}
.facts{display:flex;flex-wrap:wrap;gap:.5rem 1.5rem;margin-top:var(--s6);padding:0;list-style:none;font-size:var(--text-sm);color:var(--ink-2)}
.facts li{display:flex;align-items:center;gap:.45rem}.facts li:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ochre)}
.hero-art{position:relative}
.hero-art img{border-radius:var(--r-lg);box-shadow:0 30px 60px -30px rgba(43,36,51,.45);aspect-ratio:4/3;object-fit:cover;width:100%}
.badge{position:absolute;left:-14px;bottom:-18px;background:var(--card);border-radius:var(--r-md);padding:.8rem 1.1rem;box-shadow:0 16px 30px -18px rgba(43,36,51,.5);display:flex;align-items:baseline;gap:.5rem}
.badge b{font-family:var(--f-display);font-size:2.4rem;line-height:1;color:var(--lilac-ink)}
.badge span{font-size:var(--text-sm);color:var(--ink-2);font-weight:500}
section.band{padding:clamp(3rem,7vw,5.5rem) 0}
.alt{background:var(--paper-2);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.sec-head{max-width:640px;margin-bottom:clamp(2rem,4vw,3rem)}
.sec-head h2{font-size:var(--text-2xl)}
.sec-head p{margin-top:var(--s3);color:var(--ink-2)}
.why{display:grid;gap:var(--s6)}
@media (min-width:760px){.why{grid-template-columns:repeat(3,1fr)}}
.why article{border-top:2px solid var(--ink);padding-top:var(--s5)}
.why .n{font-family:var(--f-display);font-size:2rem;color:var(--lilac-ink);line-height:1}
.why h3{font-size:var(--text-lg);margin:var(--s3) 0 var(--s2)}
.why p{color:var(--ink-2)}
.classes{display:grid;gap:var(--s5)}
@media (min-width:640px){.classes{grid-template-columns:1fr 1fr}}
@media (min-width:1000px){.classes{grid-template-columns:repeat(4,1fr)}}
.cls{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;display:flex;flex-direction:column}
.cls img{aspect-ratio:3/2;object-fit:cover;width:100%}
.cls .tx{padding:var(--s5) var(--s5) var(--s6);border-top:4px solid var(--c)}
.cls h3{font-size:var(--text-lg)}
.cls ul{list-style:none;padding:0;margin:var(--s3) 0 0;font-size:var(--text-sm);color:var(--ink-2);display:grid;gap:.3rem}
.c-ar{--c:var(--lilac)}.c-en{--c:var(--slate)}.c-ma{--c:var(--ochre)}.c-mu{--c:var(--plum)}
.steps{display:grid;gap:var(--s5);counter-reset:s}
@media (min-width:760px){.steps{grid-template-columns:repeat(3,1fr)}}
.step{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:var(--s6)}
.step .n{width:44px;height:44px;border-radius:50%;background:var(--lilac-soft);color:var(--lilac-ink);display:grid;place-items:center;font-family:var(--f-display);font-size:1.4rem;font-weight:600}
.step h3{font-size:var(--text-lg);margin:var(--s4) 0 var(--s2)}
.step p{color:var(--ink-2)}
.book{background:var(--slate-ink);color:#fff;border-radius:var(--r-lg);padding:clamp(2rem,5vw,3.5rem);display:grid;gap:var(--s6);align-items:center;margin-top:clamp(2rem,4vw,3rem)}
@media (min-width:860px){.book{grid-template-columns:1.4fr auto}}
.book h3{font-size:var(--text-xl)}
.book p{opacity:.88;margin-top:var(--s2)}
.book .btn{background:#fff;color:var(--slate-ink)}
.extras{display:grid;gap:var(--s5)}
@media (min-width:760px){.extras{grid-template-columns:1fr 1fr}}
.extra{border-radius:var(--r-lg);padding:var(--s8);display:flex;flex-direction:column;gap:var(--s3);align-items:flex-start}
.extra h3{font-size:var(--text-lg)}
.extra p{color:var(--ink-2)}
.x-trial{background:var(--ochre-soft)}.x-trial .kicker{color:var(--ochre-ink)}
.x-pack{background:var(--lilac-soft)}
.extra a{color:var(--ink);font-weight:700;text-underline-offset:3px;margin-top:auto}
.terms{font-size:var(--text-sm);color:var(--ink-2);max-width:760px}
.terms h2{font-size:var(--text-lg);color:var(--ink);margin-bottom:var(--s3)}
.terms ul{margin:0;padding-left:1.1rem;display:grid;gap:.35rem}
footer{border-top:1px solid var(--line);padding:var(--s8) 0;font-size:var(--text-sm);color:var(--ink-2)}
footer .wrap{display:flex;flex-wrap:wrap;gap:var(--s4);justify-content:space-between;align-items:center}
footer a{color:var(--ink);font-weight:700}
@media (max-width:520px){.badge{left:12px;bottom:-16px}.btn{width:100%}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<header class="bar"><div class="wrap bar-in">
  <a class="brand" href="/" aria-label="Little Lamb Studio"><img src="../shared/logo.png" alt="" width="40" height="40"><span><b>Little Lamb Studio</b><small>小羊教室 · Tsing Yi 青衣</small></span></a>
  <div class="lang" role="group" aria-label="Language 語言"><button type="button" data-lang="en" aria-pressed="true">EN</button><button type="button" data-lang="zh" aria-pressed="false">中文</button></div>
</div></header>

<main>
<section class="hero"><div class="wrap hero-grid">
  <div>
    <p class="kicker" data-t="kicker"></p>
    <h1 data-t="title"></h1>
    <p class="zh">十二月課程九折</p>
    <p class="lead" data-t="lead"></p>
    <div class="cta">
      <a class="btn btn-wa wa" href="#" target="_blank" rel="noopener"><svg aria-hidden="true" viewBox="0 0 24 24" width="20" height="20"><path d="M4 20l1.3-3.9A8 8 0 1 1 8 19z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg><span data-t="book"></span></a>
      <a class="btn btn-ghost" href="#classes" data-t="see"></a>
    </div>
    <ul class="facts"><li data-t="f1"></li><li data-t="f2"></li><li data-t="f3"></li></ul>
  </div>
  <div class="hero-art"><img src="img/hero.jpg" alt="" width="1448" height="1086"><div class="badge"><b>10%</b><span data-t="badge"></span></div></div>
</div></section>

<section class="band alt"><div class="wrap">
  <div class="sec-head"><p class="kicker" data-t="whyK"></p><h2 data-t="whyT"></h2></div>
  <div class="why">
    <article><span class="n">01</span><h3 data-t="w1t"></h3><p data-t="w1"></p></article>
    <article><span class="n">02</span><h3 data-t="w2t"></h3><p data-t="w2"></p></article>
    <article><span class="n">03</span><h3 data-t="w3t"></h3><p data-t="w3"></p></article>
  </div>
</div></section>

<section class="band" id="classes"><div class="wrap">
  <div class="sec-head"><p class="kicker" data-t="clK"></p><h2 data-t="clT"></h2><p data-t="clS"></p></div>
  <div class="classes" id="classList"></div>
</div></section>

<section class="band alt"><div class="wrap">
  <div class="sec-head"><p class="kicker" data-t="howK"></p><h2 data-t="howT"></h2></div>
  <div class="steps">
    <div class="step"><span class="n">1</span><h3 data-t="s1t"></h3><p data-t="s1"></p></div>
    <div class="step"><span class="n">2</span><h3 data-t="s2t"></h3><p data-t="s2"></p></div>
    <div class="step"><span class="n">3</span><h3 data-t="s3t"></h3><p data-t="s3"></p></div>
  </div>
  <div class="book"><div><h3 data-t="bookT"></h3><p data-t="bookS"></p></div><a class="btn wa" href="#" target="_blank" rel="noopener"><span data-t="book"></span></a></div>
</div></section>

<section class="band"><div class="wrap">
  <div class="extras">
    <div class="extra x-trial"><p class="kicker" data-t="trK"></p><h3 data-t="trT"></h3><p data-t="tr"></p></div>
    <div class="extra x-pack"><p class="kicker" data-t="pkK"></p><h3 data-t="pkT"></h3><p data-t="pk"></p><a href="/pack/" data-t="pkL"></a></div>
  </div>
  <div class="terms" style="margin-top:clamp(2.5rem,5vw,3.5rem)"><h2 data-t="tmT"></h2><ul id="terms"></ul></div>
</div></section>
</main>

<footer><div class="wrap"><span>Little Lamb Studio 小羊教室 · Villa Esplanada, Tsing Yi 青衣灝景灣</span><a class="wa" href="#" target="_blank" rel="noopener">WhatsApp 6045 9922</a></div></footer>

<script>
var T={
kicker:{en:'December offer · Winter break',zh:'十二月優惠 · 聖誕假期'},
title:{en:'10% off December classes',zh:'十二月課程九折'},
lead:{en:'Make the winter break count. Art, English, maths and music in small groups at our Tsing Yi studio, with 10% off every class in December.',zh:'讓聖誕假期過得充實。美術、英文、數學及音樂小班課，地點青衣灝景灣，十二月所有課程一律九折。'},
book:{en:'Book on WhatsApp',zh:'WhatsApp預約'},
see:{en:'See the classes',zh:'查看課程'},
f1:{en:'Every class, 1–31 December',zh:'十二月1日至31日所有課程'},
f2:{en:'New and current families',zh:'新舊家庭均適用'},
f3:{en:'Small groups of 2 to 6',zh:'每班2至6人'},
badge:{en:'off in December',zh:'十二月九折'},
whyK:{en:'Why come in over the break',zh:'假期為何要上堂'},
whyT:{en:'A holiday that still has a rhythm',zh:'放假，也保持節奏'},
w1t:{en:'Keep the routine going',zh:'保持學習習慣'},
w1:{en:'A few classes a week keeps reading, maths and practice ticking over, so January feels easy.',zh:'每星期上幾堂，閱讀、數學和練琴不會停下來，一月開學更輕鬆。'},
w2t:{en:'Try something new',zh:'試一試新事物'},
w2:{en:'The break is a good time to try a new class: painting, abacus, phonics or piano.',zh:'假期正好試新課程：畫畫、珠算、拼音或鋼琴。'},
w3t:{en:'Small groups, close to home',zh:'小班教學，就在青衣'},
w3:{en:'Groups of 2 to 6 and one-on-one piano at Villa Esplanada, Tsing Yi.',zh:'每班2至6人，鋼琴一對一教授，地點青衣灝景灣。'},
clK:{en:'Our classes',zh:'我們的課程'},
clT:{en:'Every class is 10% off in December',zh:'十二月所有課程九折'},
clS:{en:'English is taught by native-speaking teachers. Not sure which class fits? Ask us on WhatsApp.',zh:'英文課由外籍老師任教。不知道哪一班適合？歡迎WhatsApp查詢。'},
howK:{en:'How it works',zh:'怎樣預約'},
howT:{en:'Three steps to a busy, happy break',zh:'三步安排充實假期'},
s1t:{en:'Message us on WhatsApp',zh:'WhatsApp我們'},
s1:{en:'Tell us your child’s age and which classes they’d like.',zh:'告訴我們孩子的年齡和想上的課程。'},
s2t:{en:'Pick your days',zh:'揀選日子'},
s2:{en:'We’ll suggest class times that fit around your holiday plans.',zh:'我們會按你的假期安排建議上課時間。'},
s3t:{en:'Save 10%',zh:'即享九折'},
s3:{en:'The discount comes off your December class fees.',zh:'十二月學費直接九折。'},
bookT:{en:'Places are limited over the break',zh:'假期名額有限'},
bookS:{en:'Message us now and we’ll find times that work for your family.',zh:'立即WhatsApp我們，為你安排合適時間。'},
trK:{en:'Trying a new class?',zh:'想試新課程？'},
trT:{en:'Your trial class is 50% off',zh:'試堂半價'},
tr:{en:'New or current families can try a class their child hasn’t taken yet at half price. Then join December classes at 10% off.',zh:'新舊家庭均可以半價試一個孩子未上過的課程，之後十二月課程享九折。'},
pkK:{en:'Free for parents',zh:'家長免費索取'},
pkT:{en:'10-Minute Learning at Home',zh:'每天10分鐘在家學習'},
pk:{en:'20 simple activities for the days at home, for K2 to P2.',zh:'20個在家親子小活動，適合K2至P2。'},
pkL:{en:'Get the free pack',zh:'免費索取學習包'},
tmT:{en:'The small print',zh:'條款'},
waMsg:{en:'Hi, I saw the December offer and I’d like to book December classes with 10% off.',zh:'你好，我看到十二月九折優惠，想預約十二月課程。'}
};
var TERMS={en:['10% off regular class fees for lessons held between 1 and 31 December 2026.','Open to new and current families, for every class we teach.','Book through WhatsApp. Places are subject to class availability.','Not combined with other offers on the same lesson. A 50% off trial lesson is charged at the trial price.'],
zh:['適用於2026年12月1日至31日期間上課的常規課程學費，一律九折。','新舊家庭均適用，所有課程均可使用。','請透過WhatsApp預約，名額視乎課堂情況。','同一節課不可與其他優惠同時使用；半價試堂按試堂價收費。']};
var CL=[
{c:'ar',img:'art.jpg',t:{en:'Art',zh:'美術'},i:[{en:'Children Drawing Class · 2.5+',zh:'兒童畫班 · 2.5歲+'},{en:'Advanced Art Studio · 6+, adults welcome',zh:'多元化畫班 · 6歲+，歡迎成人'}]},
{c:'en',img:'english.jpg',t:{en:'English',zh:'英文'},i:[{en:'Phonics Lab · 3+',zh:'拼音班 · 3歲+'},{en:'Everyday English · K1–P6',zh:'日常英語 · K1–P6'},{en:'All-Round English Workshop · K3+',zh:'All-Round English Workshop · K3+'},{en:'Exam Ready English · P1+',zh:'Exam Ready English · P1+'}]},
{c:'ma',img:'maths.jpg',t:{en:'Maths',zh:'數學'},i:[{en:'Olympiad and All-Round Maths · K3+',zh:'奧數及全方位數理班 · K3+'},{en:'Abacus · 3+',zh:'珠算班 · 3歲+'}]},
{c:'mu',img:'piano.jpg',t:{en:'Music',zh:'音樂'},i:[{en:'One-on-one piano · Preliminary to Grade 8',zh:'一對一鋼琴 · 初級至八級'},{en:'Music theory · Grades 1–8',zh:'樂理 · 一級至八級'}]}];
(function(){
 var qs=new URLSearchParams(location.search),lang=qs.get('lang');
 try{lang=lang||localStorage.getItem('lls-lang')}catch(e){}
 lang=lang||((navigator.language||'').toLowerCase().indexOf('zh')===0?'zh':'en'); if(lang!=='zh')lang='en';
 function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
 function render(){
  document.documentElement.lang=lang==='zh'?'zh-HK':'en';
  document.title=T.title[lang]+' · '+(lang==='zh'?'小羊教室':'Little Lamb Studio');
  document.querySelectorAll('[data-t]').forEach(function(el){var o=T[el.dataset.t]; if(o) el.textContent=o[lang]});
  document.querySelectorAll('.lang button').forEach(function(b){b.setAttribute('aria-pressed',String(b.dataset.lang===lang))});
  var href='https://wa.me/85260459922?text='+encodeURIComponent(T.waMsg[lang]);
  document.querySelectorAll('a.wa').forEach(function(a){a.href=href});
  document.getElementById('classList').innerHTML=CL.map(function(c){return '<article class="cls c-'+c.c+'"><img src="img/'+c.img+'" alt="" width="900" height="600"><div class="tx"><h3>'+esc(c.t[lang])+'</h3><ul>'+c.i.map(function(x){return '<li>'+esc(x[lang])+'</li>'}).join('')+'</ul></div></article>'}).join('');
  document.getElementById('terms').innerHTML=TERMS[lang].map(function(x){return '<li>'+esc(x)+'</li>'}).join('');
 }
 document.querySelectorAll('.lang button').forEach(function(b){b.addEventListener('click',function(){lang=b.dataset.lang;try{localStorage.setItem('lls-lang',lang)}catch(e){};render()})});
 render();
})();
</script>
</body>
