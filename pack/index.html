<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<meta property="og:title" content="10-Minute Learning at Home · 每天10分鐘在家學習">
<meta property="og:description" content="20 playful ten-minute activities for K2–P2. Free from Little Lamb Studio, Tsing Yi.">
<meta property="og:image" content="https://offers.littlelambstudio.com/pack/img/og.jpg">
<meta property="og:url" content="https://offers.littlelambstudio.com/pack/">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<link rel="canonical" href="https://offers.littlelambstudio.com/pack/">
<link rel="icon" href="../shared/logo.png">
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://api.fontshare.com/v2/css?f[]=gambetta@500,600&f[]=satoshi@400,500,700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+HK:wght@400;500;700&family=Noto+Serif+HK:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/brand.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<a class="skip" href="#activities" data-t="skip">Skip to activities</a>

<header class="bar">
  <div class="wrap bar-in">
    <a class="brand" href="#top" aria-label="Little Lamb Studio">
      <img src="../shared/logo.png" alt="" width="40" height="40">
      <span><b>Little Lamb Studio</b><small>小羊教室</small></span>
    </a>
    <div class="bar-actions">
      <div class="lang" role="group" aria-label="Language 語言">
        <button type="button" data-lang="en" aria-pressed="true">EN</button>
        <button type="button" data-lang="zh" aria-pressed="false">中文</button>
      </div>
      <a class="btn btn-ghost btn-sm dl" id="dlTop" href="pdf/LLS_10-Minute_Learning_EN.pdf" download><svg aria-hidden="true" viewBox="0 0 24 24" width="18" height="18"><path d="M12 4v11m0 0-4.5-4.5M12 15l4.5-4.5M5 19h14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg><span data-t="download">Download PDF</span></a>
    </div>
  </div>
</header>

<main id="top">
  <section class="hero">
    <div class="wrap hero-grid">
      <div class="hero-copy">
        <p class="print-only print-brand"><img src="../shared/logo.png" alt="" width="44" height="44"><span>Little Lamb Studio 小羊教室<a href="https://wa.me/85260459922">WhatsApp 6045 9922</a></span></p>
        <p class="kicker"><span data-t="title"></span> · <span data-t="kicker"></span></p>
        <h1 data-t="heroLine"></h1>
        <p class="lede" data-t="heroSub"></p>
        <div class="hero-cta">
          <button class="btn btn-primary" id="pickBtn" type="button"><svg aria-hidden="true" viewBox="0 0 24 24" width="20" height="20"><circle cx="12" cy="13" r="7.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 13V9.5M10 3h4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg><span data-t="pick"></span></button>
        </div>
        <ul class="facts" id="facts"></ul>
      </div>
      <figure class="hero-art">
        <img src="img/hero.jpg" width="1400" height="933" alt="An illustrated kitchen table with a picture book, crayons, measuring cups and a timer, with a parent's and a child's hands reaching in.">
      </figure>
    </div>
  </section>

  <section class="finder" id="activities" aria-labelledby="whereTitle">
    <div class="wrap">
      <div class="finder-head">
        <div>
          <h2 id="whereTitle" data-t="whereTitle"></h2>
          <p class="muted" data-t="whereSub"></p>
        </div>
        <button class="btn btn-ghost" id="surpriseBtn" type="button"><svg aria-hidden="true" viewBox="0 0 24 24" width="18" height="18"><path d="M4 7h3l10 10h3M4 17h3l3-3m4-4 3-3h3m0 0-2-2m2 2-2 2m2 8-2-2m2 2-2 2" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg><span data-t="surprise"></span></button>
      </div>
      <div class="chips" id="chips" role="group"></div>
    </div>
    <div id="subjects"></div>
  </section>

  <section class="praise" aria-labelledby="praiseTitle">
    <div class="wrap praise-grid">
      <div class="praise-copy">
        <p class="kicker" data-t="praiseKicker"></p>
        <h2 id="praiseTitle" data-t="praiseTitle"></h2>
        <p class="muted" data-t="praiseSub"></p>
      </div>
      <div class="flips" id="flips"></div>
    </div>
  </section>

  <section class="week" aria-labelledby="weekTitle">
    <div class="wrap week-grid">
      <figure class="week-art"><img src="img/together.jpg" width="1400" height="933" loading="lazy" alt="A parent's hand and a child's hand putting a drawing on the fridge beside a weekly tick chart."></figure>
      <div>
        <p class="kicker" data-t="weekKicker"></p>
        <h2 id="weekTitle" data-t="weekTitle"></h2>
        <p class="muted screen-only" data-t="weekSub"></p>
        <p class="muted print-only" data-t="weekPrint"></p>
        <div class="days" id="days" role="group"></div>
        <p class="week-count" id="weekCount" aria-live="polite"></p>
      </div>
    </div>
  </section>

  <section class="offers" aria-labelledby="trialTitle">
    <div class="wrap offers-grid">
      <article class="ticket">
        <div class="ticket-main">
          <p class="kicker" data-t="trialKicker"></p>
          <h2 id="trialTitle" data-t="trialTitle"></h2>
          <p data-t="trialBody"></p>
          <a class="btn btn-wa screen-only" id="trialBtn" href="#" target="_blank" rel="noopener"><svg aria-hidden="true" viewBox="0 0 24 24" width="20" height="20"><path d="M4 20l1.3-3.9A8 8 0 1 1 8 19z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg><span data-t="trialBtn"></span></a>
          <a class="print-only print-wa" href="https://wa.me/85260459922?text=TRIAL%20%E8%A9%A6%E5%A0%82" data-t="trialPrintBtn"></a>
          <p class="print-only small" data-t="trialPrint"></p>
        </div>
        <div class="ticket-stub">
          <img src="../shared/logo.png" alt="" width="64" height="64">
          <span class="stub-free">FREE</span>
          <span class="stub-zh">免費</span>
        </div>
        <p class="small ticket-small" data-t="trialSmall"></p>
      </article>
      <article class="refer">
        <p class="kicker" data-t="referKicker"></p>
        <h3 data-t="referTitle"></h3>
        <p data-t="referBody"></p>
        <button class="btn btn-ghost screen-only" id="shareBtn" type="button"><svg aria-hidden="true" viewBox="0 0 24 24" width="18" height="18"><path d="M8 12h8m-3-4 4 4-4 4M5 5v14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg><span data-t="shareBtn"></span></button>
        <p class="share-note muted" id="shareNote" aria-live="polite"></p>
      </article>
    </div>
  </section>

  <section class="classes" aria-labelledby="classesTitle">
    <div class="wrap">
      <p class="kicker" data-t="classesKicker"></p>
      <h2 id="classesTitle" data-t="classesTitle"></h2>
      <p class="muted narrow" data-t="classesSub"></p>
      <div class="class-cols" id="classCols"></div>
    </div>
  </section>
</main>

<footer class="foot">
  <div class="wrap foot-in">
    <div>
      <p class="foot-ask" data-t="contact"></p>
      <p class="print-only small" data-t="tapLink"></p>
      <a class="wa-big" id="waBig" href="https://wa.me/85260459922" target="_blank" rel="noopener">WhatsApp 6045 9922</a>
      <p class="small">Little Lamb Studio 小羊教室 · Villa Esplanada, Tsing Yi 青衣灝景灣</p>
    </div>
    <p class="small consent" data-t="consent"></p>
  </div>
</footer>

<dialog id="sheet" aria-labelledby="sheetTitle">
  <div class="sheet-in">
    <div class="sheet-top">
      <span class="tag" id="sheetTag"></span>
      <button class="icon-btn" id="sheetClose" type="button"><svg aria-hidden="true" viewBox="0 0 24 24" width="22" height="22"><path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg><span class="sr" data-t="close"></span></button>
    </div>
    <h2 id="sheetTitle"></h2>
    <p class="sheet-hook" id="sheetHook"></p>
    <ol class="steps" id="sheetSteps"></ol>
    <div class="bubble"><span class="bubble-k" data-t="ask"></span><p id="sheetAsk"></p></div>
    <div class="widget" id="sheetWidget"></div>
    <div class="timer" id="timer">
      <svg viewBox="0 0 120 120" class="ring" aria-hidden="true"><circle cx="60" cy="60" r="52" class="ring-bg"/><circle cx="60" cy="60" r="52" class="ring-fg" id="ringFg"/></svg>
      <div class="timer-side">
        <span class="timer-k" data-t="timer"></span>
        <span class="timer-v" id="timerV" aria-live="off">10:00</span>
        <div class="timer-btns">
          <button class="btn btn-sm btn-primary" id="tStart" type="button" data-t="start"></button>
          <button class="btn btn-sm btn-ghost" id="tReset" type="button" data-t="reset"></button>
        </div>
      </div>
    </div>
    <p class="time-up" id="timeUp" aria-live="polite"></p>
    <button class="btn btn-done" id="doneBtn" type="button" aria-pressed="false"></button>
  </div>
</dialog>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
